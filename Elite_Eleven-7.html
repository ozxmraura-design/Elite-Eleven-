<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elite Eleven™</title><meta name="theme-color" content="#050914"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e8eef8;--fg:#0b1220;--card:#fff;--accent:#ffd23f;--muted:#4a5b78;--in:#eef2f9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--fg:#f3f6fb;--card:#152036;--muted:#9fb0c9;--in:#0d1628}}
:root[data-theme="dark"]{--bg:#0b1220;--fg:#f3f6fb;--card:#152036;--muted:#9fb0c9;--in:#0d1628}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{height:100%;margin:0;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#wrap{position:relative;overflow:hidden;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.35);user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#gl,#c{position:absolute;inset:0}
.b{position:absolute;bottom:3%;width:4.3em;height:4.3em;border-radius:50%;border:.15em solid #fff;color:#fff;font:800 .85em system-ui;display:none;align-items:center;justify-content:center;touch-action:none;opacity:.92}

#panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,8,16,.6);overflow:auto}
#panel[hidden]{display:none}
.card{width:86%;background:var(--card);color:var(--fg);border-radius:1.1em;padding:1.1em;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5);border:1px solid rgba(128,140,170,.25);font-size:.9em}
.card h1{margin:.1em 0 .3em;font-size:1.5em;letter-spacing:.04em}.card p{margin:.3em 0 .8em;color:var(--muted);line-height:1.35}
.btn{display:block;width:100%;padding:.75em;margin-top:.5em;border:0;border-radius:.8em;font:inherit;font-weight:800;cursor:pointer;text-decoration:none;box-sizing:border-box;text-align:center}
.pri{background:var(--accent);color:#1a1300}.sec{background:transparent;color:var(--fg);border:2px solid var(--muted)}
.in{width:100%;box-sizing:border-box;margin:.2em 0;padding:.6em;border-radius:.6em;border:1px solid var(--muted);background:var(--in);color:var(--fg);font:inherit}
.sw{display:flex;gap:.5em;justify-content:center;margin:.5em 0}.sw i{width:2em;height:2em;border-radius:50%;border:.15em solid transparent}.sw i.on{border-color:var(--fg)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:.3em}.big{font-size:2.6em;font-weight:900;color:var(--accent);line-height:1.1}
.fg{display:grid;grid-template-columns:repeat(4,1fr);gap:.3em;max-height:17em;overflow:auto;margin-bottom:.4em}.fb{border:1px solid var(--muted);background:var(--in);color:var(--fg);border-radius:.6em;padding:.35em .1em;font:inherit;font-size:1.5em;cursor:pointer}.fb small{display:block;font-size:.4em;font-weight:700;margin-top:.1em}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.3em}button:focus-visible,.b:focus-visible,.in:focus-visible{outline:3px solid var(--accent);outline-offset:2px}#panel{align-items:flex-start}#panel>.card{margin:auto}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 60%,rgba(0,0,0,.34) 100%)}

.ls .card{width:62%;padding:.7em}.ls .card h1{font-size:1.25em}.ls .fg{grid-template-columns:repeat(6,1fr);max-height:11em}

/* ===== PRO THEME ===== */
:root{--bg:#050914;--fg:#f4f7ff;--card:#0e1730;--muted:#9db0d4;--in:#0a1226;--accent:#ffd23f;--gold:linear-gradient(180deg,#ffe27a,#f5b800)}
html,body{background:radial-gradient(ellipse at 50% 30%,#10204a,#050914 70%)!important;font-family:"SF Pro Display","Segoe UI",Roboto,Inter,system-ui,sans-serif}
#gl{filter:contrast(1.1) saturate(1.15) brightness(1.03)}
#wrap{border-radius:0!important;box-shadow:none!important}
#vig{mix-blend-mode:normal;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 52%,rgba(2,6,18,.55) 100%),linear-gradient(180deg,rgba(2,6,18,.35),rgba(0,0,0,0) 18%,rgba(0,0,0,0) 80%,rgba(2,6,18,.4))}
#panel{background:rgba(3,7,18,.55)!important;-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
.card{background:linear-gradient(160deg,rgba(22,34,68,.94),rgba(7,12,28,.96))!important;border:1px solid rgba(255,255,255,.13)!important;border-radius:1.3em!important;box-shadow:0 18px 60px rgba(0,0,0,.65),0 0 0 1px rgba(255,210,63,.07),inset 0 1px 0 rgba(255,255,255,.12)!important;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;left:12%;right:12%;top:0;height:2px;background:linear-gradient(90deg,transparent,#ffd23f,transparent)}
.card h1{font-weight:900!important;letter-spacing:.14em!important;background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.btn{border-radius:.9em!important;transition:transform .12s,filter .12s;letter-spacing:.03em}.btn:active{transform:scale(.97)}
.pri{background:var(--gold)!important;color:#2a1c00!important;box-shadow:0 6px 18px rgba(245,184,0,.35),inset 0 1px 0 rgba(255,255,255,.6)}
.sec{background:rgba(255,255,255,.05)!important;border:1.5px solid rgba(255,255,255,.22)!important;color:var(--fg)}
.in,.fb{background:rgba(255,255,255,.05)!important;border:1px solid rgba(255,255,255,.16)!important;border-radius:.8em!important}
.sw i{box-shadow:0 3px 10px rgba(0,0,0,.5),inset 0 2px 3px rgba(255,255,255,.35)}.sw i.on{border-color:#fff!important;transform:scale(1.12)}
.big{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 8px rgba(245,184,0,.35))}
.b{border:.12em solid rgba(255,255,255,.75)!important;box-shadow:0 6px 18px rgba(0,0,0,.5),0 0 18px var(--g,rgba(255,255,255,.25)),inset 0 .25em .4em rgba(255,255,255,.35),inset 0 -.3em .5em rgba(0,0,0,.3);-webkit-backdrop-filter:blur(2px);letter-spacing:.06em;text-shadow:0 1px 3px rgba(0,0,0,.6)}
#bs{background:radial-gradient(circle at 35% 30%,#ff7a85,#d62839 70%)!important;--g:rgba(230,57,70,.55)}
#bp{background:radial-gradient(circle at 35% 30%,#6ea2ff,#1d4ed8 70%)!important;--g:rgba(37,99,235,.55)}
#bz{background:radial-gradient(circle at 35% 30%,#4ade80,#15803d 70%)!important;--g:rgba(22,163,74,.55)}
.b:active{transform:scale(.93)}

/* ===== HOME SCREEN v2 ===== */
@keyframes rise{from{opacity:0;transform:translateY(1em) scale(.97)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-3.5%)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes shine{0%,55%{left:-40%}100%{left:130%}}
@keyframes ray{0%{opacity:.5}100%{opacity:1}}
@keyframes twk{0%,100%{opacity:.15;transform:translateY(0)}50%{opacity:1;transform:translateY(-1.2em)}}
#panel.hm{background:#030716!important;-webkit-backdrop-filter:none;backdrop-filter:none;overflow:hidden;align-items:stretch;padding:0}
.home{position:absolute;inset:0;overflow:hidden;color:#fff;font-family:"SF Pro Display","Segoe UI",Roboto,Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;--gold:linear-gradient(180deg,#ffe58a,#f5b800);--pl:max(1.1em,env(safe-area-inset-left,0px));--pr:max(1.1em,env(safe-area-inset-right,0px));--bs:15em;--bx:63%;--by:43%;--hz:57%}
.home.l{--bs:14em;--bx:74%;--by:50%;--hz:57%}
.home *{box-sizing:border-box}
/* --- backdrop: night stadium built from layers --- */
.scene{position:absolute;inset:0;background:radial-gradient(ellipse 75% 50% at var(--bx) var(--by),rgba(46,98,230,.55),rgba(14,30,90,0) 72%),radial-gradient(ellipse 110% 70% at 50% 0%,#162c72,#070e2c 58%,#030716)}
.scene:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 12% 3%,#fff 0,rgba(214,228,255,.9) .9%,rgba(140,172,255,.32) 3.5%,transparent 8%),radial-gradient(circle at 88% 3%,#fff 0,rgba(214,228,255,.9) .9%,rgba(140,172,255,.32) 3.5%,transparent 8%),radial-gradient(circle at 36% 6%,rgba(255,255,255,.9) 0,rgba(160,190,255,.25) 2.4%,transparent 6%),radial-gradient(circle at 64% 6%,rgba(255,255,255,.9) 0,rgba(160,190,255,.25) 2.4%,transparent 6%)}
.rays{position:absolute;left:0;right:0;top:0;height:var(--hz);mix-blend-mode:screen;animation:ray 6s ease-in-out infinite alternate;-webkit-mask:linear-gradient(180deg,#000,transparent 92%);mask:linear-gradient(180deg,#000,transparent 92%);background:conic-gradient(at 12% -6%,transparent 0 108deg,rgba(170,200,255,.24) 115deg,transparent 124deg 132deg,rgba(170,200,255,.14) 138deg,transparent 147deg),conic-gradient(at 88% -6%,transparent 0 213deg,rgba(170,200,255,.24) 221deg,transparent 229deg 237deg,rgba(170,200,255,.14) 243deg,transparent 252deg)}
.crowd{position:absolute;left:0;right:0;top:calc(var(--hz) - 10%);height:10%;opacity:.6;background:radial-gradient(circle,rgba(255,210,63,.85) 0 1px,transparent 1.7px) 0 0/7px 6px,radial-gradient(circle,rgba(110,160,255,.9) 0 1px,transparent 1.7px) 3px 3px/9px 7px,radial-gradient(circle,rgba(235,240,255,.75) 0 .8px,transparent 1.5px) 5px 1px/11px 8px;-webkit-mask:linear-gradient(180deg,transparent,#000 45%,#000 75%,transparent);mask:linear-gradient(180deg,transparent,#000 45%,#000 75%,transparent)}
.pit{position:absolute;left:0;right:0;top:var(--hz);height:calc(100% - var(--hz));width:100%;display:block}
.haze{position:absolute;left:0;right:0;top:calc(var(--hz) - 4%);height:10%;background:linear-gradient(180deg,transparent,rgba(120,170,255,.2) 55%,transparent);pointer-events:none}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(3,7,22,.72),rgba(3,7,22,0) 20%,rgba(3,7,22,0) 50%,rgba(3,7,22,.55) 74%,rgba(3,7,22,.96) 100%)}
.home.l .shade{background:linear-gradient(90deg,rgba(3,7,22,.92),rgba(3,7,22,.6) 38%,rgba(3,7,22,0) 66%),linear-gradient(180deg,rgba(3,7,22,.6),rgba(3,7,22,0) 24%,rgba(3,7,22,.7) 100%)}
/* --- hero art: floating ball + outlined 11 --- */
.orb{position:absolute;width:var(--bs);height:var(--bs);left:calc(var(--bx) - var(--bs)/2);top:calc(var(--by) - var(--bs)/2);z-index:1;pointer-events:none;opacity:0;animation:fadeIn .8s .15s forwards}
.orb:before{content:"";position:absolute;inset:-30%;background:radial-gradient(circle,rgba(80,140,255,.5),rgba(255,210,63,.1) 46%,transparent 68%)}
.orb:after{content:"";position:absolute;left:12%;right:12%;bottom:-8%;height:7%;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.6),transparent 70%)}
.orb .fl{position:absolute;inset:0;animation:floaty 5s ease-in-out infinite}
.orb svg{width:100%;height:100%;overflow:visible;display:block}
.orb .r1{transform-origin:100px 100px;animation:spin 34s linear infinite}
.orb .r2{transform-origin:100px 100px;animation:spinr 22s linear infinite}
.orb .sp1{transform-origin:100px 100px;animation:spin 26s linear infinite}
.sps i{position:absolute;width:.32em;height:.32em;border-radius:50%;background:#ffd23f;box-shadow:0 0 .8em #ffd23f;animation:twk 3.2s ease-in-out infinite;pointer-events:none}
/* --- top bar --- */
.top{position:absolute;left:0;right:0;top:0;padding:.8em var(--pr) .6em var(--pl);display:flex;align-items:center;justify-content:space-between;z-index:3;gap:.6em;animation:rise .5s both}
.prof,.chip,.ib{background:rgba(8,16,44,.7);border:1px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.prof{display:flex;align-items:center;gap:.6em;border-radius:3em;padding:.3em 1.2em .3em .4em;min-width:0}
.crest{width:2.1em;height:2.3em;flex:none}
.prof span{min-width:0}
.prof b{display:block;font-size:.9em;letter-spacing:.05em;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase}
.prof small{display:block;font-size:.62em;color:#a6b9ea;letter-spacing:.14em;text-transform:uppercase;margin-top:.2em;font-weight:700}
.chips{display:flex;align-items:center;gap:.5em;flex:none}
.chip{display:flex;align-items:center;gap:.45em;height:2.4em;padding:0 .35em 0 .85em;border-radius:3em;font-weight:800;font-size:.85em}
.chip .plus{width:1.7em;height:1.7em;border-radius:50%;border:0;background:var(--gold);color:#241800;font:900 1em/1 system-ui;display:grid;place-items:center;padding:0;cursor:pointer}
.ib{width:2.5em;height:2.5em;border-radius:50%;color:#fff;padding:.55em;cursor:pointer;display:grid;place-items:center}
.ib svg{width:100%;height:100%}
.ib:active,.chip .plus:active{transform:scale(.92)}
/* --- hero title --- */
.hero{position:absolute;left:var(--pl);top:4.9em;z-index:2;pointer-events:none;animation:rise .6s .1s both}
.eyebrow{font-size:.66em;letter-spacing:.36em;color:#ffd23f;font-weight:800;display:flex;align-items:center;gap:.9em}
.eyebrow:before{content:"";width:2.6em;height:2px;background:var(--gold)}
.hero h1{margin:.35em 0 0;font-style:italic;font-weight:900;line-height:.9;font-size:3.1em;text-transform:uppercase;text-shadow:0 .1em .5em rgba(0,0,0,.6)}
.hero h1 span,.hero h1 b{display:block;-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.1em}
.hero h1 span{background-image:linear-gradient(180deg,#fff,#b5c4ea)}
.hero h1 b{background-image:var(--gold);font-weight:900}
.hero p{margin:.9em 0 0;font-size:.7em;letter-spacing:.3em;color:#cdd9f7;font-weight:600;text-shadow:0 1px 4px #000}
.home.l .hero{top:4.3em}
.home.l .eyebrow{display:none}
.home.l.inv .hero p{display:none}
.home.l .hero h1{font-size:2.3em}
.home.l .hero h1 span,.home.l .hero h1 b{display:inline}
.home.l .hero p{margin-top:.7em}
/* --- menu cards --- */
.menu{position:absolute;left:var(--pl);right:var(--pr);bottom:4em;display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:min-content;gap:.5em;z-index:2}
.home.l .menu{right:auto;width:max(24em,min(31em,46%));bottom:3.5em}
.mc{position:relative;display:flex;align-items:center;gap:.8em;min-width:0;padding:.5em .9em .5em .6em;border-radius:1em;border:1px solid rgba(255,255,255,.15);color:#fff;text-align:left;font:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;overflow:hidden;background:linear-gradient(135deg,rgba(26,46,100,.88),rgba(8,15,40,.92));box-shadow:0 .5em 1.4em rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.14);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:transform .15s,filter .15s;opacity:0;animation:rise .5s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*65ms + 150ms)}
.mc:active{transform:scale(.97);filter:brightness(1.25)}
.mc .ic{flex:none;width:2.7em;height:2.7em;border-radius:.8em;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);display:grid;place-items:center}
.mc .ic svg{width:1.6em;height:1.6em}
.mc .tx{min-width:0;display:block}
.mc .tt{display:block;font-weight:900;letter-spacing:.05em;text-transform:uppercase;font-size:.95em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc .st{display:block;font-size:.7em;color:#aebfe8;margin-top:.35em;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc .ch{margin-left:auto;flex:none;width:2em;height:2em;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);color:#ffd23f;font-weight:900;font-size:1.2em;line-height:1;padding-bottom:.1em}
.mc.cta{grid-column:1/-1;height:5.2em;background:var(--gold);color:#1c1300;border-color:rgba(255,255,255,.75);box-shadow:0 .6em 2em rgba(245,184,0,.4),inset 0 1px 0 rgba(255,255,255,.75)}
.mc.cta .ic{background:#10162b;border-color:transparent}
.mc.cta .tt{font-size:1.2em;letter-spacing:.04em}
.mc.cta .st{color:#4a3500;font-weight:600}
.mc.cta .ch{background:#10162b;color:#ffd23f}
.mc.cta:after{content:"";position:absolute;top:0;bottom:0;width:28%;left:-40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:shine 3.8s ease-in-out infinite 1.4s;pointer-events:none}
.mc.onl{grid-column:span 3;height:4.2em;background:linear-gradient(135deg,#2e6bff,#17379f 72%);border-color:rgba(150,190,255,.55)}
.mc.tm{grid-column:span 3;height:4.2em}
.mc.sm{grid-column:span 2;height:3.7em;flex-direction:column;justify-content:center;gap:.3em;text-align:center;padding:.4em}
.mc.sm .ic{width:auto;height:auto;background:none;border:0}
.mc.sm .ic svg{width:1.5em;height:1.5em}
.mc.sm .tt{font-size:.72em;letter-spacing:.07em}
.mc.invr.h{grid-column:span 3;font-size:.66em;padding:0 .5em}
.mc.invr{white-space:nowrap}
.mc.invr{grid-column:1/-1;height:2.6em;justify-content:center;background:var(--gold);color:#1a1200;font-weight:900;font-size:.8em;letter-spacing:.04em;border-radius:3em;text-transform:uppercase}
.home.l .mc.cta{height:4.5em}
.home.l .mc.cta .ic{width:2.4em;height:2.4em}
.home.l .mc.cta .tt{font-size:1.12em}
.home.l .mc.onl,.home.l .mc.tm{height:3.7em}
.home.l .mc.onl .ic,.home.l .mc.tm .ic{width:2.3em;height:2.3em}
.home.l .mc.sm{height:3.1em;gap:.15em}
.home.l .mc.invr{height:2.2em}
.home.l.inv .mc.cta{height:4.1em}.home.l.inv .mc.onl,.home.l.inv .mc.tm{height:3.4em}.home.l.inv .mc.sm{height:2.8em}
/* --- bottom nav --- */
.nav{position:absolute;left:0;right:0;bottom:0;height:3.5em;display:flex;align-items:stretch;background:linear-gradient(180deg,rgba(7,13,36,.93),rgba(3,6,20,.99));border-top:1px solid rgba(255,255,255,.1);z-index:3;padding:0 var(--pr) env(safe-area-inset-bottom,0px) var(--pl)}
.home.l .nav{height:2.9em}
.nav button{flex:1;background:none;border:0;color:#7f93c6;font:inherit;font-weight:800;font-size:.6em;letter-spacing:.09em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.45em;cursor:pointer;position:relative;padding:0}
.nav button svg{width:2.5em;height:2.5em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.home.l .nav button{flex-direction:row;gap:.7em;font-size:.62em}
.home.l .nav button svg{width:2em;height:2em}
.nav button.on{color:#ffd23f}
.nav button.on svg{fill:rgba(255,210,63,.2)}
.nav button.on:before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;background:var(--gold);box-shadow:0 0 1em #ffd23f;border-radius:0 0 3px 3px}
.nav button:active{transform:scale(.94)}
#toast{position:absolute;left:50%;bottom:5em;transform:translate(-50%,2em);background:rgba(10,20,50,.95);border:1px solid #ffd23f;color:#fff;padding:.5em 1.2em;border-radius:2em;font-weight:700;font-size:.8em;opacity:0;transition:.3s;pointer-events:none;z-index:9}#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.home *{animation:none!important}.home .mc,.home .orb{opacity:1!important}}

/* ===== MATCH CONTROLS v2 ===== */
.b{flex-direction:column;gap:.3em;width:4.4em!important;height:4.4em!important;font:800 1em/1 system-ui!important;letter-spacing:0!important;border:.13em solid rgba(255,255,255,.9)!important;opacity:1!important;box-shadow:0 .45em 1.1em rgba(0,0,0,.55),0 0 1.3em var(--g,rgba(255,255,255,.25)),inset 0 .25em .5em rgba(255,255,255,.45),inset 0 -.5em .8em rgba(0,0,0,.35)!important}
.b svg{width:1.7em;height:1.7em;fill:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.55));pointer-events:none}
.b span{font-size:.58em;letter-spacing:.14em;font-weight:900;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.6)}
#bs{width:5.6em!important;height:5.6em!important;right:1.2em;bottom:2.4em}
#bs svg{width:2.2em;height:2.2em}
#bp{right:7.8em;bottom:1.6em}
